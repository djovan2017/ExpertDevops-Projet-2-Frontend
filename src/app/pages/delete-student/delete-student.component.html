<div class="card m-3">
  <h5 class="card-header">Supprimer un étudiant</h5>
  <div class="card-body">
    <form [formGroup]="deleteForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Id de l'étudiant</label>
        <input
          type="number"
          formControlName="id"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['id'].errors }"
        />
        @if (submitted && form['id'].errors) {
          <div class="invalid-feedback">
            @if (form['id'].errors?.['required']) {
              <div>L'id est requis</div>
            }
          </div>
        }
      </div>
      <div class="text-center">
        <button class="btn btn-danger mr-1" type="submit" [disabled]="isSubmitting">
          @if (isSubmitting) {
            Suppression...
          } @else {
            Supprimer
          }
        </button>
      </div>

      @if (submitted && deleteStatus === 'error') {
        <div class="alert alert-danger mt-3" [matTooltip]="deleteTooltip" matTooltipClass="status-tooltip-multiline" matTooltipPosition="above">La suppression a échoué.</div>
      }

      @if (deleteStatus === 'success') {
        <div class="alert alert-success mt-3" [matTooltip]="deleteTooltip" matTooltipClass="status-tooltip-multiline" matTooltipPosition="above">Étudiant supprimé avec succès.</div>
      }
    </form>

    <div class="text-center mt-3">
      <a routerLink="/students" class="btn btn-secondary mr-1">Retour au menu</a>
      <button class="btn btn-secondary" type="button" (click)="logout()">Déconnexion</button>
    </div>
  </div>
</div>
